{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block footer %}{% endblock %}
{% block content %}
<div style="min-height:calc(100vh - 66px); display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 60%, #1a3a5c 100%); padding:2rem;">
  <div style="background:#fff; border-radius:20px; box-shadow:0 20px 60px rgba(0,0,0,.3); width:100%; max-width:420px; padding:2.5rem;" class="fade-in">
    <div class="text-center mb-3">
      <div style="font-size:2.5rem;">💼</div>
      <h2 style="margin-bottom:.3rem;">Welcome Back</h2>
      <p class="text-muted">Sign in to your JobPortal account</p>
    </div>
    <form method="post">
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" name="email" class="form-control" placeholder="you@email.com" required>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <div style="position:relative;">
          <input type="password" name="password" id="pwd" class="form-control" placeholder="Your password" required>
          <button type="button" onclick="togglePwd()" style="position:absolute;right:.8rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-muted);">👁</button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top:.5rem;">Sign In →</button>
    </form>
    <p class="text-center mt-2" style="font-size:.9rem; color:var(--text-muted);">
      Don't have an account? <a href="{{ url_for('auth.signup') }}" style="color:var(--gold); font-weight:600;">Sign up free</a>
    </p>
    <div style="border-top:1px solid var(--border); margin-top:1.5rem; padding-top:1rem; text-align:center; font-size:.8rem; color:var(--text-muted);">
      Demo Admin: <strong>admin@jobportal.com</strong> / <strong>admin123</strong>
    </div>
  </div>
</div>
<script>function togglePwd(){ const f=document.getElementById('pwd'); f.type=f.type==='password'?'text':'password'; }</script>
{% endblock %}
